<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Trip Started</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="max-w-md mx-auto min-h-screen flex items-center justify-center p-6">

    <div class="bg-white rounded-3xl shadow-xl p-8 text-center w-full">

        <!-- Success Icon -->

        <div class="text-7xl mb-6">
            ✅
        </div>

        <!-- Heading -->

        <h1 class="text-3xl font-bold text-green-600 mb-4">

            Trip Started Successfully

        </h1>

        <!-- Trip ID -->

        <div class="bg-gray-100 rounded-2xl p-4 mb-6">

            <p class="text-gray-500 text-sm mb-2">
                Trip ID
            </p>

            <p class="text-2xl font-bold">

                {{ trip_id }}

            </p>

        </div>

        <!-- Message -->

        <p class="text-gray-600 text-lg mb-8">

            Your trip submission has been received successfully.

        </p>

        <!-- Button -->

        <a href="/"
           class="block w-full bg-orange-500 hover:bg-orange-600 transition text-white text-xl font-bold py-4 rounded-2xl">

            Start Another Trip

        </a>

    </div>

</div>

</body>
</html>
