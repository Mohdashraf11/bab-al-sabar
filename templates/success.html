{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Trip Started</title>

    <link rel="icon"
      type="image/png"
      href="{% static 'images/logo.png' %}">

    <link rel="apple-touch-icon"
        href="{% static 'images/logo.png' %}">

    <link rel="manifest"
      href="{% static 'manifest.json' %}">   

    <meta name="apple-mobile-web-app-capable"
        content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

    <meta name="apple-mobile-web-app-title"
        content="Bab Al Sabarr">  

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        .fade-up {
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>

</head>

<body class="bg-gradient-to-br from-green-900 to-emerald-700">

<div class="max-w-md mx-auto min-h-screen flex items-center justify-center p-6 fade-up ">

    <div class="bg-white rounded-3xl shadow-xl p-8 text-center w-full backdrop-blur-xl border border-white/20">

        <!-- Success Icon -->

        <div class="w-24 h-24 mx-auto rounded-full bg-green-100 flex items-center justify-center text-5xl shadow-lg">
            ✅
        </div>

        <!-- Heading -->

        <h1 class="text-3xl font-bold text-green-600 mb-4">

            Trip Started Successfully

        </h1>

        <!-- Trip ID -->

        <div class="bg-gray-100 rounded-2xl p-4 mb-6">

            <p class="text-gray-500 text-sm mb-2">
                Trip ID
            </p>

            <p class="text-2xl font-bold">

                {{ trip_id }}

            </p>

        </div>

        <!-- Message -->

        <p class="text-gray-600 text-lg mb-8">

            Your trip submission has been received successfully.

        </p>

        <!-- Button -->

        <a href="/"
           class="block w-full bg-emerald-600 hover:bg-emerald-700 transition text-white text-xl font-bold py-4 rounded-2xl">

            Done ..

        </a>

    </div>

</div>

<script>

    if ('serviceWorker' in navigator) {

        window.addEventListener('load', () => {

            navigator.serviceWorker.register(
                "{% static 'service-worker.js' %}"
            )

            .then(reg => console.log('Service Worker Registered'))

            .catch(err => console.log(err));

        });

    }

</script>

</body>
</html>
